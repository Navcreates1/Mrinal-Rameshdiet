<style>
:root{
  /* Grounded in a kitchen, not a gym: curry-leaf green, chilli, turmeric, indigo.
     Marigold is reserved exclusively for the two festival fasting windows. */
  --paper:#FBFAF7;
  --card:#FFFFFF;
  --ink:#1A1D21;
  --ink-2:#5C6470;
  --ink-3:#949CA8;
  --rule:#E6E3DC;
  --leaf:#0F5449;      /* calories — the hero metric */
  --leaf-soft:#E4EEEA;
  --chilli:#B23A2E;    /* protein */
  --turmeric:#C08A1E;  /* carbohydrate */
  --indigo:#4A6FA5;    /* fat */
  --marigold:#E08A00;  /* festival / vegetarian days */
  --marigold-soft:#FDF1DE;
  --shadow:0 1px 2px rgba(26,29,33,.05), 0 8px 24px -12px rgba(26,29,33,.14);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:88px;
}
.wrap{max-width:460px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- hero ---------- */
.hero{background:var(--leaf);color:#fff;padding:22px 0 20px;position:relative;overflow:hidden}
@media (display-mode:standalone){.hero{padding-top:calc(22px + env(safe-area-inset-top))}.nav{padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}}
.hero.veg{background:#8A5A06}
.hero .wrap{position:relative;z-index:2}
.hero-name{font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;letter-spacing:.03em;opacity:.88;font-weight:500}
.hero-tag{font-family:'Fraunces',serif;font-size:30px;line-height:1.08;font-weight:700;margin:2px 0 14px}
.goal{display:flex;gap:0;border-top:1px solid rgba(255,255,255,.26);padding-top:12px}
.goal div{flex:1;min-width:0;padding-right:10px}
.goal div:last-child{flex:.72;padding-right:0}
.goal b{display:block;font-family:'Fraunces',serif;font-size:21px;font-weight:600;line-height:1.1}
.goal span{display:block;font-size:11px;opacity:.88;letter-spacing:.01em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- date strip ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:46px;padding:7px 0;border-radius:11px;text-align:center;background:var(--paper);border:1px solid var(--rule)}
.dchip s{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-decoration:none}
.dchip b{display:block;font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.25}
.dchip.veg{background:var(--marigold-soft);border-color:#F2D9A8}
.dchip.veg s{color:#B06E00}
.dchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dchip.on s{color:rgba(255,255,255,.6)}
.dchip.on.veg{background:var(--marigold);border-color:var(--marigold)}
.dchip.on.veg s{color:rgba(255,255,255,.8)}

/* ---------- banners ---------- */
.banner>span:first-child{flex:0 0 auto;width:24px;height:24px}
.banner>span:first-child svg{width:24px;height:24px;display:block}
.oilnote>span:first-child{flex:0 0 auto;width:20px;height:20px}
.oilnote>span:first-child svg{width:20px;height:20px;display:block}
.banner{display:flex;gap:11px;align-items:flex-start;background:var(--marigold-soft);border:1px solid #F2D9A8;border-radius:var(--r);padding:11px 13px;margin:14px 0;font-size:13px;line-height:1.45;color:#6B4400}
.banner b{color:#8A5A06}
.banner.warn{background:#FBEDEB;border-color:#F0D2CD;color:#7A2C22}
.banner.warn b{color:var(--chilli)}

/* ---------- ring + macros ---------- */
.dash{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);margin:14px 0}
.ringrow{display:flex;align-items:center;gap:18px}
.ringwrap{position:relative;width:118px;height:118px;flex:0 0 auto}
.ringwrap svg{transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-family:'Fraunces',serif;font-size:31px;font-weight:600;line-height:1}
.ringtxt s{font-size:11px;letter-spacing:.01em;color:var(--ink-3);text-decoration:none;margin-top:3px}
.bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.bar b{font-family:'Fraunces',serif;font-size:15px;font-weight:600}
.bar .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-2);margin-bottom:4px}
.bar .lab i{font-style:normal;font-size:12px;font-weight:500;color:var(--ink-2)}
.track{height:7px;border-radius:4px;background:var(--rule);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.bar.p .track i{background:var(--chilli)}
 .bar.p b{color:var(--chilli)}
.bar.c .track i{background:var(--turmeric)} .bar.c b{color:var(--turmeric)}
.bar.f .track i{background:var(--indigo)} .bar.f b{color:var(--indigo)}
.bar.p .track{height:10px}
.fibre{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--rule);margin-top:14px;padding-top:11px}

/* ---------- mode toggle ---------- */
.modes{display:flex;background:var(--rule);border-radius:11px;padding:3px;margin:16px 0 4px}
.modes button{flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.modes button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.modehint{font-size:12px;color:var(--ink-2);margin:8px 2px 14px;line-height:1.45}

/* ---------- meal cards ---------- */
.meal{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.mhead{display:flex;align-items:center;gap:12px;padding:13px 14px}
.mart{flex:0 0 auto;width:52px;height:52px;border-radius:11px;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.veg .mart{background:var(--marigold-soft)}
.mart svg{width:36px;height:36px;display:block}
.mtitle{flex:1;min-width:0}
.mtitle s{display:block;font-size:11.5px;letter-spacing:.01em;color:var(--ink-3);text-decoration:none}
.mtitle b{display:block;font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;line-height:1.25;margin-top:1px}
.mkcal{flex:0 0 auto;text-align:right}
.mkcal b{display:block;font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--leaf)}
.mkcal s{display:block;font-size:9.5px;color:var(--ink-3);text-decoration:none;font-weight:500;margin-top:1px}
.mkcal{max-width:118px}
.mbody{border-top:1px solid var(--rule);padding:4px 14px 13px}
.ing{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--rule)}
.ing:last-of-type{border-bottom:0}
.ing .g{flex:0 0 auto;min-width:62px;font-family:'Fraunces',serif;font-size:15px;font-weight:600}
.ing .n{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.ing .n em{display:block;font-style:normal;font-size:11px;color:var(--ink-3)}
.ing .k{flex:0 0 auto;font-size:12px;color:var(--ink-2);text-align:right}
.swapbtn{flex:0 0 auto;padding:5px 9px;border:1px solid var(--rule);border-radius:8px;font-size:11px;font-weight:600;color:var(--leaf);background:var(--paper)}
.swapbtn:active{background:var(--leaf-soft)}
.oilnote{display:flex;gap:8px;align-items:flex-start;background:#FBEDEB;border-radius:10px;padding:9px 11px;margin-top:10px;font-size:11.5px;line-height:1.45;color:#7A2C22}
.method{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule)}
.method ol{margin:0;padding-left:17px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.method li{margin-bottom:4px}
.method li::marker{color:var(--leaf);font-weight:700}

/* ---------- generic ---------- */
.sec{margin:24px 0 10px}
.sec h2{font-size:20px}
.sec p{margin:5px 0 0;font-size:13px;color:var(--ink-2);line-height:1.5}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h3{font-size:15.5px;margin-bottom:7px}
.panel p{font-size:13px;color:var(--ink-2);line-height:1.55;margin:0 0 8px}
.panel p:last-child{margin-bottom:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.kv span:first-child{flex:1.5;min-width:0}
.kv b{flex:1;text-align:right}
.kv span:not(:first-child){flex:1;text-align:right}
.kv:last-child{border-bottom:0}
.kv b{font-family:'Fraunces',serif;font-weight:600;flex:0 0 auto}
.kv span{color:var(--ink-2)}
.src{font-size:10.5px;color:var(--ink-3);line-height:1.5;margin-top:9px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.01em}
.pill.v{background:var(--marigold-soft);color:#8A5A06}
.pill.n{background:var(--leaf-soft);color:var(--leaf)}
.pill.w{background:#FBEDEB;color:var(--chilli)}
.wbadge{display:block;margin-top:4px;padding:3px 7px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-align:center;background:#FBEDEB;color:var(--chilli);border:1px solid #EFC9C2}
.wbadge.dry{background:#FDF1DE;color:#8A5A06;border-color:#EDCE9C}

/* three portions per ingredient: what goes in the pan, and each plate */
.ing{display:block;padding:11px 0}
.iname{font-size:14px;line-height:1.35;font-weight:500}
.iname em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-2);font-weight:400;margin-top:1px}
.iname .wbadge{display:inline-block;margin:4px 0 0}
.pgrid{display:flex;gap:6px;margin-top:8px}
.pcell{flex:1;min-width:0;border:1px solid var(--rule);border-radius:9px;padding:6px 7px;background:var(--paper)}
.pcell s{display:block;font-size:9.5px;letter-spacing:.03em;color:var(--ink-3);text-decoration:none;margin-bottom:1px}
.pcell b{display:block;font-family:'Fraunces',serif;font-size:16px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.pcell i{display:block;font-style:normal;font-size:10px;color:var(--ink-2);margin-top:2px}
.pcell.pan{background:var(--leaf);border-color:var(--leaf);color:#fff}
.pcell.pan s{color:rgba(255,255,255,.72)}
.veg .pcell.pan{background:#8A5A06;border-color:#8A5A06}
.pcell.mm{border-color:#E8BDB5;background:#FDF5F3}
.pcell.rr{border-color:#BCCDE4;background:#F3F7FC}
.pcell.mm s,.pcell.rr s{font-weight:700;font-size:11px;letter-spacing:.01em}
.pcell.mm s{color:var(--chilli)} .pcell.rr s{color:var(--indigo)}
.pcell.mm b{color:#7A2C22} .pcell.rr b{color:#2F4C74}
.miniring h4{font-size:15px}
.miniring.m h4{color:var(--chilli)} .miniring.r h4{color:var(--indigo)}
.miniring.m{border-color:#E8BDB5} .miniring.r{border-color:#BCCDE4}
.pcell.dim{opacity:.34}
.ing .swapbtn{margin-top:8px}
.swaprow{display:flex;justify-content:flex-end}
/* who the page is showing */
.whobar{display:flex;gap:6px;background:var(--rule);border-radius:11px;padding:3px;margin:14px 0 0}

.modes{background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow)}
.modes button.on{background:var(--leaf);color:#fff}
.changebtn{display:block;width:100%;padding:10px;border-top:1px solid var(--rule);font-size:12.5px;font-weight:600;color:var(--leaf);background:var(--paper)}
.changebtn:active{background:var(--leaf-soft)}
.whobar button{flex:1;padding:8px 0;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.whobar button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
/* must outrank '.whobar button' above, which sets a dark grey that was
   rendering at 1.95:1 against the dark header — effectively invisible */
.whobar.hero-who{background:rgba(0,0,0,.26);margin:12px 0 0;padding:4px}
.whobar.hero-who button{color:#fff;font-weight:600;font-size:13px;opacity:1}
.whobar.hero-who button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.duo{display:flex;gap:10px}
.duo>div{flex:1;min-width:0}
.miniring{text-align:center;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:13px 8px;box-shadow:var(--shadow)}
.miniring h4{margin:0 0 7px;font-family:'Fraunces',serif;font-size:14.5px;font-weight:600}
.miniring .ringwrap{width:92px;height:92px;margin:0 auto}
.miniring .ringtxt b{font-size:24px}
.miniring .ringtxt s{font-size:9.5px}
.mmacro{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;gap:3px}
.mmacro div{flex:1}
.mmacro b{display:block;font-family:'Fraunces',serif;font-size:13.5px;font-weight:600}
.mmacro s{display:block;text-decoration:none;color:var(--ink-3);font-size:9.5px}
.copybar{display:flex;gap:8px;margin:14px 0 4px}
.copybar button{flex:1;padding:12px 10px;border-radius:11px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.copybar button.alt{background:var(--card);color:var(--ink);border:1px solid var(--rule)}
.copybar button.done{background:var(--leaf)}
.lunchbox{display:inline-block;padding:2px 7px;border-radius:6px;background:#EEF2F8;color:var(--indigo);font-size:10.5px;font-weight:600;margin-left:6px}
.ing .g{min-width:74px}
.cook{display:block;font-style:normal;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.cook b{color:var(--ink);font-weight:600}
.ing .n em{color:var(--ink-2);font-size:11.5px}
.opt .on2 em{color:var(--ink-2)}
.frow .fn em{color:var(--ink-2);font-size:11px}

/* ---------- food table ---------- */
.search{width:100%;padding:11px 13px;border:1px solid var(--rule);border-radius:11px;background:var(--card);font-size:14px;margin-bottom:10px}
.search:focus{outline:2px solid var(--leaf);outline-offset:1px}
.filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;padding:6px 12px;border:1px solid var(--rule);border-radius:20px;font-size:12px;font-weight:500;background:var(--card);color:var(--ink-2)}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.frow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:10px 12px;margin-bottom:7px}
.frow .fn{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.frow .fn em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.frow .fm{flex:0 0 auto;text-align:right;font-size:11px;color:var(--ink-2);line-height:1.5}
.frow .fm b{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--ink);display:block}
.frow .fm i{font-style:normal;color:var(--chilli);font-weight:600}

/* ---------- progress ---------- */
.chartbox{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.wform{display:flex;gap:8px;margin-top:12px}
.wform input{flex:1;padding:11px 13px;border:1px solid var(--rule);border-radius:11px;font-size:14px;background:var(--paper)}
.wform button{flex:0 0 auto;padding:11px 18px;border-radius:11px;background:var(--leaf);color:#fff;font-weight:600;font-size:13.5px}
.milestone{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
.milestone:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule);flex:0 0 auto}
.dot.done{background:var(--leaf)}
.milestone .mt{flex:1;font-size:13px}
.milestone .mt em{display:block;font-style:normal;font-size:11px;color:var(--ink-3)}
.milestone b{font-family:'Fraunces',serif;font-weight:600;font-size:14px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--rule);z-index:60;padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:460px;margin:0 auto;display:flex}
.nav button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:10px;font-weight:600;letter-spacing:.02em}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--leaf)}
.hidden{display:none}

/* ---------- swap sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(26,29,33,.42);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;background:var(--paper);border-radius:20px 20px 0 0;z-index:90;transform:translateY(101%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheethead{padding:14px 16px 10px;border-bottom:1px solid var(--rule);flex:0 0 auto;position:relative}
#sheetClose{position:absolute;right:12px;top:20px;padding:7px 12px;border-radius:9px;background:var(--rule);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.sheethead h3{font-size:17px}
.sheethead p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
.grab{width:34px;height:4px;border-radius:3px;background:var(--rule);margin:0 auto 11px}
.sheetbody{overflow-y:auto;padding:12px 16px 28px;-webkit-overflow-scrolling:touch}
.opt{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:11px 12px;margin-bottom:8px;width:100%;text-align:left}
.opt.on{border-color:var(--leaf);background:var(--leaf-soft)}
.opt .oi{flex:0 0 auto;width:38px;height:38px;border-radius:9px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.opt .oi svg{width:26px;height:26px}
.opt .on2{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.opt .on2 em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.opt .om{flex:0 0 auto;text-align:right;font-size:10.5px;color:var(--ink-2);line-height:1.45}
.opt .om b{display:block;font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:6px}
</style>
</head>

<script>
/* ============================================================
   FOOD DATABASE — per 100 g unless stated.
   src codes: U=USDA FoodData Central, I=IFCT 2017 (via secondary
   sources citing it), C=UK CoFID/McCance & Widdowson, L=product label.

/* Rotating each slot independently let high days stack: the ring swung
   1391-1578 for Mrinal and 1766-2009 for Ramesh. These seven days are chosen
   so every one lands on target for BOTH of them, with a different main meal
   each day, and never two pulse-based mains in the same day. */
const CYCLE={"nv": [["bnv2", "mm2", "lnv2", "sn1", "dnv3"], ["bnv1", "mm2", "lnv4", "sn1", "dnv1"], ["bnv2", "mm1", "lnv1", "sn1", "dnv2"], ["bnv1", "mm2", "lnv2", "sn1", "dnv1"], ["bnv1", "mm1", "lnv2", "sn1", "dnv2"], ["bnv1", "mm1", "lnv3", "sn3", "dnv3"], ["bnv1", "mm2", "lnv3", "sn3", "dnv1"]], "v": [["bv2", "mm1", "lv2", "sn3", "dv3"], ["bv1", "mm1", "lv4", "sn3", "dv6"], ["bv1", "mm1", "lv1", "sn3", "dv2"], ["bv1", "mm1", "lv6", "sn3", "dv1"], ["bv3", "mm1", "lv2", "sn1", "dv2"], ["bv2", "mm1", "lv1", "sn1", "dv3"], ["bv1", "mm1", "lv6", "sn3", "dv6"]]};
/* fixed-mode plate: identical every day, no decisions */
const FIXED={nv:['bnv1','mm1','lnv1','sn1','dnv1'],v:['bv1','mm1','lv1','sn1','dv1']};
/* variable-mode rotation */
const ROT={
 nv:{b:['bnv1','bnv2','bhuel'],mm:['mm1','mm2'],l:['lnv1','lnv2','lnv3','lnv4'],s:['sn1','sn2','sn3'],d:['dnv1','dnv2','dnv3']},
 v :{b:['bv1','bv2','bv3','bhuel'],mm:['mm1','mm2'],l:['lv1','lv2','lv3','lv4','lv5','lv6'],s:['sn1','sn2','sn3'],d:['dv1','dv2','dv3','dv4','dv5','dv6']}
};

/* ================= calendar ================= */
const START=new Date(2026,7,31), END=new Date(2026,11,10);
const VEG=[[new Date(2026,8,14),new Date(2026,8,25)],[new Date(2026,9,11),new Date(2026,9,20)]];
const DAYS=Math.round((END-START)/864e5)+1;
const dayOf=i=>new Date(START.getTime()+i*864e5);
const isVeg=d=>VEG.some(([a,b])=>d>=a&&d<=b);
const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});

const PEOPLE={
  M:{name:'Mrinal',start:65,goal:59,ht:155,age:39,sex:'F',bmr:1263,tdee:1870,
     t:{k:1420,p:120,c:130,f:42,fb:28},colour:'var(--chilli)'},
  R:{name:'Ramesh',start:75,goal:70,ht:169,age:45,sex:'M',bmr:1586,tdee:2180,
     t:{k:1800,p:140,c:175,f:60,fb:35},colour:'var(--indigo)'}
};
/* Ramesh is not a flat multiple of Mrinal. Protein tracks body weight (x1.17)
   while carbohydrate and fat track the much wider calorie gap (x1.35, x1.43),
   so portions are scaled per slot rather than by one number. */
const SCALE={pro:1.167,carb:1.346,veg:1.25,fruit:1.25,fat:1.429};
function ratioFor(fid,type){
  if(SCALE[type]) return SCALE[type];
  const o=F[fid], m=Math.max(o.p*4,o.c*4,o.f*9);
  return m===o.p*4?SCALE.pro : m===o.f*9?SCALE.fat : SCALE.carb;
}
function gramsFor(who,fid,g,type){
  if(who==='M') return g;
  const step=F[fid].ml?2.5:5;
  return Math.max(step, Math.round(g*ratioFor(fid,type)/step)*step);
}
const TGT=PEOPLE.M.t;
const state={day:0,mode:'variable',tab:'today',who:'both',swaps:{},picks:{},w:{M:[],R:[]}};

/* ================= maths ================= */
const per=(fid,g)=>{const o=F[fid];return{k:o.k*g/100,p:o.p*g/100,c:o.c*g/100,f:o.f*g/100,fb:(o.fb||0)*g/100};};
function mealItems(mid,slotKey){
  return M[mid].x.map((row,idx)=>{
    const key=slotKey+':'+idx, sw=state.swaps[key];
    return sw?{fid:sw.fid,g:sw.g,type:row[2],idx,key,swapped:1}:{fid:row[0],g:row[1],type:row[2],idx,key};
  });
}
function mealTotal(mid,slotKey){
  return mealItems(mid,slotKey).reduce((a,it)=>{const v=per(it.fid,it.g);
    a.k+=v.k;a.p+=v.p;a.c+=v.c;a.f+=v.f;a.fb+=v.fb;return a;},{k:0,p:0,c:0,f:0,fb:0});
}
function todayMeals(){
  const veg=isVeg(dayOf(state.day)), set=veg?'v':'nv';
  if(state.mode==='fixed') return FIXED[set].map((id,n)=>({id,slot:['b','mm','l','s','d'][n]}));
  const R=ROT[set], day=CYCLE[set][state.day%CYCLE[set].length];
  return ['b','mm','l','s','d'].map((slot,n)=>{
    const pool=R[slot], picked=state.picks[state.day+':'+slot];
    return {id:(picked&&pool.includes(picked))?picked:day[n], slot, pool};
  });
}
const slotKey=(slot,mid)=>state.day+':'+state.mode+':'+slot+':'+mid;
function dayTotalFor(who,meals){
  return (meals||todayMeals()).reduce((a,m)=>{
    mealItems(m.id,slotKey(m.slot,m.id)).forEach(it=>{
      const g=gramsFor(who,it.fid,it.g,it.type), v=per(it.fid,g);
      a.k+=v.k;a.p+=v.p;a.c+=v.c;a.f+=v.f;a.fb+=v.fb;});
    return a;},{k:0,p:0,c:0,f:0,fb:0});
}
const dayTotal=()=>dayTotalFor('M');
/* swap keeps the macro ROLE, not the gram weight: swapping 145 g chicken for
   whey rescales to match the protein it replaced, so the day stays on target. */
function swapGrams(type,oldFid,oldG,newFid){
  const o=F[oldFid],n=F[newFid];
  let g=oldG;
  if(type==='pro'&&n.p>0) g=(o.p*oldG)/n.p;
  else if((type==='carb'||type==='fruit')&&n.c>0) g=(o.c*oldG)/n.c;
  /* Matching the macro alone breaks on fat-heavy foods: matching chicken's
     protein with whole egg means 261 g of egg and +220 kcal. So the swap is
     also capped on energy — the day's calorie target is what drives the loss,
     and the protein cost of a swap is shown to her instead of hidden. */
  if(n.k>0){ const cap=((o.k*oldG/100)*1.3+30)/n.k*100; g=Math.min(g,cap); }
  const r=Math.max(5,Math.round(g/5)*5);
  return Math.min(r, n.ml?60:500);
}
const LABEL={pro:'Protein',carb:'Carbohydrate',veg:'Vegetable',fruit:'Fruit',fat:'Oil',fix:''};
const POOLFOR=t=>t==='pro'?(isVeg(dayOf(state.day))?POOL.pro_v:POOL.pro_nv):t==='carb'?POOL.carb:t==='veg'?POOL.veg:t==='fruit'?POOL.fruit:POOL.fat;

/* ================= render helpers ================= */
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const ico=n=>`<svg><use href="#i-${n}"></use></svg>`;
const amt=(fid,g)=>F[fid].ml?g+' ml':Math.round(g)+' g';
const badge=fid=>{const o=F[fid];return o.w?`<span class="wbadge ${o.w==='dry'?'dry':''}">weigh ${o.w}</span>`:'';};
function cooked(fid,g){const o=F[fid];

    ? `<span class="cook">shrinks to about <b>${out} g</b> in the pan — the ${Math.round(g)} g is what you weigh</span>`
    : `<span class="cook">swells to about <b>${out} g</b> cooked — the ${Math.round(g)} g is what you weigh</span>`;}

function miniRing(who){

function ring(){

    <div class="track"><i style="width:${Math.min(100,val/tg*100)}%"></i></div></div>`;
  return `<div class="dash"><div class="ringrow">

        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(pct,1))}" style="transition:stroke-dashoffset .5s"/>
    </svg><div class="ringtxt"><b class="num">${Math.round(t.k)}</b><s>of ${TGT.k} kcal</s></div></div>
    <div class="bars">
      ${bar('p','Protein',t.p,TGT.p,' g')}
      ${bar('c','Carbs',t.c,TGT.c,' g')}
      ${bar('f','Fat',t.f,TGT.f,' g')}
    </div></div>
    ${t.f<32?`<div class="oilnote" style="margin-top:12px"><span>${ico('oil')}</span><span>Fat is under 32 g today. That is low enough to matter for hormones over time — swap in salmon, full-fat paneer, or add 10 g of almonds (about eight). Fat is not the enemy here; the oil poured by eye is.</span></div>`:''}
    <div class="fibre"><span>Fibre</span><span><b class="num" style="font-family:Fraunces,serif;font-weight:600">${Math.round(t.fb)} g</b> <span style="color:var(--ink-3)">of ${TGT.fb} g</span></span></div>
    </div>`;
}

function mealCard(m,n){
  const key=slotKey(m.slot,m.id), items=mealItems(m.id,key), t=mealTotal(m.id,key), meal=M[m.id];
  const names=['Breakfast','Mid-morning','Lunch','Afternoon','Dinner'];
  const oil=items.filter(i=>F[i.fid].ml).reduce((a,i)=>a+per(i.fid,i.g).k+per(i.fid,gramsFor('R',i.fid,i.g,i.type)).k,0);
  const showM=state.who!=='R', showR=state.who!=='M';
  const rows=items.map(it=>{
    const o=F[it.fid], can=state.mode==='variable'&&it.type!=='fix';
    const gM=it.g, gR=gramsFor('R',it.fid,it.g,it.type);
    const vM=per(it.fid,gM), vR=per(it.fid,gR);
    const pan=(showM?gM:0)+(showR?gR:0);
    const cell=(cls,lab,g,v)=>`<div class="pcell ${cls}"><s>${lab}</s><b>${amt(it.fid,g)}</b>
      <i>${Math.round(v.k)} kcal · ${v.p.toFixed(0)} g P</i></div>`;
    return `<div class="ing">
      <div class="iname">${o.n}${it.swapped?' <span class="pill n">swapped</span>':''}${badge(it.fid)}
        <em>${o.s}</em></div>

        ${state.who==='both'?`<div class="pcell pan"><s>Into the pan</s><b>${amt(it.fid,pan)}</b><i>cook this much</i></div>`:''}
        ${showM?cell('mm','Mrinal',gM,vM):''}
        ${showR?cell('rr','Ramesh',gR,vR):''}
      </div>
      ${cooked(it.fid,pan)}

    </div>`;}).join('');
  return `<article class="meal${isVeg(dayOf(state.day))?' veg':''}">
    <div class="mhead"><div class="mart">${ico(meal.ic)}</div>
      <div class="mtitle"><s>${names[n]}${m.slot==='l'?'<span class="lunchbox">packs for work</span>':''}</s><b>${meal.t}</b></div>
      <div class="mkcal">${state.who==='both'
        ?`<b class="num" style="font-size:16px">${Math.round(t.k)} <span style="color:var(--ink-3);font-weight:400">/</span> <span style="color:var(--indigo)">${Math.round(dayTotalFor('R',[m]).k)}</span></b><s><span style="color:var(--chilli);font-weight:700">Mrinal</span> / <span style="color:var(--indigo);font-weight:700">Ramesh</span></s>`

      <div class="method"><ol>${meal.m.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    </div>
    ${state.mode==='variable'&&m.pool&&m.pool.length>1
      ?`<button class="changebtn" data-meal="${m.slot}" aria-label="Choose a different ${names[n].toLowerCase()}">Change meal — ${m.pool.length} options for ${names[n].toLowerCase()}</button>`:''}
    </article>`;
}

function dayText(who){
  const P=PEOPLE[who], names=['Breakfast','Mid-morning','Lunch','Afternoon','Dinner'];
  const d=dayOf(state.day).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  let out=`${P.name} — ${d}${isVeg(dayOf(state.day))?' (vegetarian day)':''}\n`;
  todayMeals().forEach((m,n)=>{
    out+=`\n${names[n]}: ${M[m.id].t}\n`;
    mealItems(m.id,slotKey(m.slot,m.id)).forEach(it=>{
      const g=gramsFor(who,it.fid,it.g,it.type), o=F[it.fid];
      out+=`  ${amt(it.fid,g)}  ${o.n}${o.w?' ('+o.w+' weight)':''}\n`;});
  });
  const t=dayTotalFor(who);
  out+=`\nDay total: ${Math.round(t.k)} kcal · ${t.p.toFixed(0)} g protein · ${t.c.toFixed(0)} g carbs · ${t.f.toFixed(0)} g fat · ${t.fb.toFixed(0)} g fibre`;
  out+=`\nTarget:    ${P.t.k} kcal · ${P.t.p} g protein · ${P.t.c} g carbs · ${P.t.f} g fat`;
  out+=`\n\nWeigh raw or dry as marked, before cooking. Log the oil as its own entry.`;
  return out;
}

    try{ const ta=document.createElement('textarea'); ta.value=txt;

}

  </div>
  <div class="panel"><h3>He is not just a bigger portion of her</h3>
    <p>His food is 1.27 times hers overall, but that splits unevenly: <b>1.17× the protein, 1.35× the carbohydrate, 1.43× the fat</b>. Protein tracks body weight, which is close between them. Carbohydrate and fat track the calorie gap, which is wide.</p>
    <p>So the app scales each ingredient by what it is doing in the dish, not by one blanket number. Multiply her whole plate by 1.27 and he ends up short on carbohydrate and eating more protein than he needs.</p>
  </div>
  <div class="banner warn"><span>${ico('chicken')}</span><div><b>Two sessions a week is the weak point in both plans.</b> For Mrinal, three sessions is the difference between 6 kg by 10 December and 5 kg. For Ramesh, who has only just started, two is the right place to begin — but his 2,180 figure assumes he is moving during the day. If he is at a desk and driving, it is nearer 2,000 and his intake should come down to about 1,620. Check it against the scale after three weeks rather than trusting my estimate.</div></div>
  <div class="sec"><h2>The two vegetarian windows</h2></div>
  <div class="panel">
    <div class="kv"><span>Ganesh Chaturthi</span><b>14 – 25 Sep</b></div>
    <div class="kv"><span>Dasara</span><b>11 – 20 Oct</b></div>
    <div class="kv"><span>Vegetarian days in the plan</span><b>22 of 101</b></div>
    <p class="src">Verified: Ganesh Chaturthi falls on Monday 14 September 2026; Sharad Navratri runs 11–19 October with Vijayadashami on Tuesday 20 October 2026.</p>
  </div>
  <div class="banner"><span>${ico('dal')}</span><div><b>This is the part that usually fails.</b> Dal cannot carry 120 g of protein at this calorie level — moong gives 7 g of protein per 100 kcal, whey gives 24 g. On vegetarian days the yoghurt, paneer and whey do the work and the dal brings fibre and flavour. Remove them and the day lands near 70 g of protein, which is where muscle starts going instead of fat.</div></div>
  <div class="panel"><h3>Huel</h3>
    <p>Available as a breakfast on any day, including the vegetarian windows — it is vegan. Black Edition is the one to buy: 40 g of protein per 90 g serving against 30 g for standard Huel, with roughly half the carbohydrate.</p>
    <p>Be clear about what it is buying, though. At 400 kcal for 40 g of protein it is <b>10 g of protein per 100 kcal</b> — respectable, but her egg bhurji and the Greek yoghurt breakfast both beat it. Huel wins on speed, not on nutrition. Use it on the mornings that have already gone wrong, not as the default.</p>
    <p class="src">Figures derived from Huel's own 90 g serving: 400 kcal, 40 g protein, 17.5 g fat, 8.4 g fibre. Carbohydrate varies between 19 and 25 g depending on flavour — check the pouch and correct it in the Foods tab if yours differs.</p></div>
  <div class="sec"><h2>How many meals are in here</h2></div>
  <div class="panel">
    <div class="kv"><span>Non-vegetarian day combinations</span><b class="num">${combos.nv}</b></div>
    <div class="kv"><span>Vegetarian day combinations</span><b class="num">${combos.v}</b></div>
    <div class="kv"><span>Lunch combinations via swap (protein × carb × vegetable)</span><b class="num">${swapCombos.toLocaleString('en-GB')}</b></div>
    <p class="src">Rather than a fixed list of recipes with invented numbers, every meal is assembled from ${Object.keys(F).length} ingredients with sourced per-100 g values. Swap any component and the portion rescales to hold the macros — so every one of those combinations is accurate, not just plausible.</p>
  </div>
  <div class="sec"><h2>Training</h2></div>
  <div class="panel">
    <p><b>Three sessions a week, minimum two of them strength.</b> Full body, not splits — she has two children and limited time, and full-body twice a week beats a five-day split she cannot attend.</p>
    <p>Progressive overload is the whole game: same movements each week, slightly more weight or one more repetition. Squat or leg press, a hinge, a push, a pull, and a carry. 8,000 steps stays as the floor on every day, training or not.</p>
    <p class="src">A 16-week randomised trial in women training twice weekly found vegetarians eating 1.0 g/kg protein gained the same muscle and strength as non-vegetarians eating 1.3 g/kg. Adequate beats perfect.</p>
  </div>`;
}

      ${d.length>1?`<polyline points="${d.map(p=>`${x(p.d)},${y(p.kg)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>`:''}

      <text x="${W-8}" y="${y(P2.goal)+12}" font-size="9" fill="${col}" text-anchor="end" font-family="IBM Plex Sans">${P2.goal} kg</text>`;};
  const rows=['M','R'].map(w=>{const P2=PEOPLE[w], c=latest(w),

  <div class="chartbox">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${line('M')}${line('R')}
      <text x="${P}" y="${H-8}" font-size="9" fill="var(--ink-3)" font-family="IBM Plex Sans">31 Aug</text>
      <text x="${W-8}" y="${H-8}" font-size="9" fill="var(--ink-3)" text-anchor="end" font-family="IBM Plex Sans">10 Dec</text>
      ${state.w.M.length+state.w.R.length===0?`<text x="${W/2}" y="${H/2}" font-size="11" fill="var(--ink-3)" text-anchor="middle" font-family="IBM Plex Sans">First weigh-in goes here</text>`:''}
    </svg>
    <div class="whobar" style="margin:12px 0 0">${['M','R'].map(w=>`<button data-log="${w}" class="${who===w?'on':''}">Log for ${PEOPLE[w].name}</button>`).join('')}</div>
    <div class="wform"><input id="wIn" type="number" step="0.1" inputmode="decimal" aria-label="Weight in kilograms today" placeholder="${PEOPLE[who].name}'s weight today">
      <button id="wAdd">Save</button></div>
    ${!canSave?`<div class="oilnote" style="margin-top:11px"><span>${ico('whey')}</span><span>Weigh-ins will not survive closing the page in this view. Keep the real record in the logging app — this chart is for seeing the shape of it.</span></div>`:''}
    <p class="src">Each dotted line is the pace that reaches that person's goal by 10 December. Above the line is behind, below is ahead. One week above means nothing. Three in a row means something to change.</p>

  <div class="banner"><span>${ico('greens')}</span><div><b>Take the tape measure too.</b> At 39 and 45, with strength training starting, the scale can stall for a fortnight while waists keep dropping. Measure at the navel, same day as the weigh-in.</div></div>`;

function viewGuide(){
  return `
  <div class="sec"><h2>The rules</h2><p>Seven things. If they only ever do these, the rest works itself out.</p></div>
  <div class="panel"><h3>1. Weigh it raw, and weigh it dry</h3>
    <p>Chicken is 106 kcal per 100 g raw and 165 kcal cooked. Rice roughly triples in weight when cooked. Dal loses two-thirds of its protein per 100 g by absorbing water.</p>
    <p>Every number in this plan is the <b>raw or dry</b> weight. Weigh before it touches the pan. Getting this backwards is a 200 kcal error a day, which is the whole deficit.</p></div>
  <div class="panel"><h3>2. Measure the oil with a spoon</h3>
    <p>All cooking oils are the same: about 40 kcal per 5 ml, 120 kcal per tablespoon. Sunflower, rapeseed, groundnut, mustard — identical. Ghee is the same again.</p>
    <p>A sabzi cooked by eye takes two or three tablespoons across the pan. That is 250–370 kcal of calories she will never see, on a 1,420 kcal day. Cutting a sabzi from 3 tablespoons to 1 saves 240 kcal — more than any food swap in this plan.</p>
    <p><b>One teaspoon. Levelled. Into the pan, not over it.</b></p></div>
  <div class="panel"><h3>3. Protein first, every meal</h3>
    <p>120 g a day, which is about 2 g per kg of her target weight. Build the plate around the protein and fit everything else around it — not the other way round.</p>
    <p class="src">The ISSN position stand states that higher intakes, in the range 2.3–3.1 g/kg/day, may be needed to maximise retention of lean body mass during hypocaloric periods. The point of the protein is that the 6 kg she loses is fat, not muscle.</p></div>
  <div class="panel"><h3>4. Vegetables are nearly free — use them</h3>
    <p>Lauki is 14 kcal per 100 g. Ash gourd 13. Cucumber 15. Karela 21. Spinach 23. A 200 g portion of most Indian sabzi vegetables costs 30–60 kcal and brings 3–5 g of fibre.</p>
    <p>This is the lever that makes 1,420 kcal survivable instead of miserable. When she is hungry, the answer is another 200 g of vegetables, not a smaller dinner tomorrow.</p></div>
  <div class="panel"><h3>5. Log it the same day</h3>
    <p><b>HealthifyMe</b> has the best Indian dish database — built around katori and plate portions. <b>Nutracheck</b> is the strongest for UK supermarket and branded items. Use HealthifyMe for home-cooked Indian food and Nutracheck for anything with a barcode.</p>
    <p>Build her repeated meals as saved recipes once, then logging takes ten seconds. Log the oil as a separate line, always.</p></div>
  <div class="panel"><h3>6. Sleep is part of the plan</h3>
    <p>She is on under seven hours. Short sleep is linked to higher ghrelin and lower leptin — hungrier, and worse at deciding. It will not stop the weight coming off, but it makes every day harder than it needs to be.</p>
    <p>Seven hours is a plan target, the same as the protein target.</p></div>
  <div class="panel"><h3>7. Cook once, serve twice</h3>
    <p>Every meal card shows three figures: what goes in the pan, then each plate. Weigh the pan total, cook it as one dish, then <b>weigh the two plates separately</b> before anyone sits down.</p>
    <p>Serving by eye is where this falls apart. His plate is roughly a quarter bigger than hers — close enough to look identical, far enough to matter. Two plates on the scale takes twenty seconds.</p>
    <p>His lunch is a lunchbox, so pack his portion straight from the pan the night before. It is the same food, weighed at the same time.</p></div>
  <div class="sec"><h2>For Ramesh specifically</h2></div>
  <div class="panel"><h3>Cholesterol</h3>
    <p>Slightly raised, everything else normal. This plan already suits that — oats, dal, chana, rajma and vegetables are all soluble fibre, which is the dietary lever with the best evidence behind it. His fibre target is set higher than hers at 35 g for that reason.</p>
    <p>Two things to steer by when swapping: prefer <b>rapeseed or sunflower oil over ghee</b>, and prefer <b>low-fat paneer, tofu and fish over full-fat paneer</b>. The swap screen shows both, and for him the unsaturated option is the better pick even when the calories match.</p>
    <p>Oily fish twice a week is worth building in — the salmon lunch is there for that, not just for variety.</p></div>
  <div class="panel"><h3>Alcohol</h3>
    <p>Occasional, and he is stopping for three months. That is worth more than it sounds. Four pints a week is roughly 800 kcal — about a fifth of his weekly shortfall, and the calories arrive alongside worse decisions about food.</p>
    <p>Nothing in this plan budgets for it. If a night out happens, log it honestly rather than skipping a meal to compensate.</p></div>
  <div class="sec"><h2>Supplements</h2></div>
  <div class="panel">
    <div class="kv"><span>Vitamin D — she is deficient</span><b>continue year-round</b></div>
    <div class="kv"><span>Vitamin B12 — she is deficient</span><b>continue year-round</b></div>
    <div class="kv"><span>Creatine monohydrate</span><b>3–5 g daily</b></div>
    <div class="kv"><span>Ferritin</span><b>test, do not guess</b></div>
    <div class="kv"><span>Ramesh — repeat lipid panel</span><b>after 12 weeks</b></div>
    <p class="src">NHS advice is that all UK adults consider 10 µg (400 IU) of vitamin D daily through autumn and winter; people previously treated for deficiency are usually kept on 20–50 µg (800–2,000 IU). The SACN upper limit is 100 µg. Both vegetarian windows and the 10 December target sit inside the low-sunlight months, and the vegetarian windows also cut her dietary B12 further — so neither supplement pauses.</p>
    <p class="src">Creatine has a stronger case for her than for most: vegetarians start with a lower muscle creatine store, and it is well supported for strength in women who resistance-train. Iron is a real risk for a menstruating vegetarian in a deficit — but test ferritin rather than supplementing blind.</p>
    <p class="src"><b>Doses are for discussion with her GP, not a prescription from a web page.</b> She has two known deficiencies; that conversation is worth having before December.</p>
  </div>
  <div class="sec"><h2>Where this could go wrong</h2></div>
  <div class="panel">
    <div class="kv"><span>Loses under 0.2 kg a week for three weeks</span><b>add steps first</b></div>
    <div class="kv"><span>Loses over 0.7 kg a week</span><b>eat 150 kcal more</b></div>
    <div class="kv"><span>Strength dropping in the gym</span><b>protein and sleep, in that order</b></div>
    <div class="kv"><span>Persistent fatigue</span><b>check ferritin, B12, vitamin D</b></div>
    <p class="src">One bad week is noise. Three make a pattern. Change one thing at a time, and give it a fortnight before deciding it did not work.</p>
  </div>
  <div class="banner warn"><span>${ico('roti')}</span><div><b>This is a plan, not medical advice.</b> Mrinal has two diagnosed deficiencies and is eating at the lower end of what the NHS recommends for women. Ramesh has raised cholesterol, which is a clinical matter and not a dietary one to settle from a web page. Both should run this past a GP or a registered dietitian before starting, and again if anything feels wrong.</div></div>`;
}

function openSwap(key,type,fid,g){
  const pool=POOLFOR(type).filter(x=>x!==fid);
  document.getElementById('sheetTitle').textContent='Swap the '+LABEL[type].toLowerCase();
  document.getElementById('sheetSub').textContent=type==='pro'?'Portions rescale to match the protein you are replacing.'
    :type==='carb'?'Portions rescale to match the carbohydrate you are replacing.'
    :type==='fat'?'All oils are identical in calories. This changes flavour, not maths.'
    :type==='fruit'?'Fruit swaps by carbohydrate, so the sugar stays the same.'
    :'Vegetables swap gram for gram — they are all cheap.';
  const base=per(fid,g);
  const opts=[fid,...pool].map(nf=>{
    const ng=nf===fid?g:swapGrams(type,fid,g,nf);
    return {nf,ng,v:per(nf,ng)};
  }).sort((a,b)=>(a.nf===fid?-1:b.nf===fid?1:b.v.p-a.v.p));
  document.getElementById('sheetBody').innerHTML=opts.map(({nf,ng,v})=>{
    const o=F[nf], dp=v.p-base.p, dk=v.k-base.k, cur=nf===fid;
    const pt=Math.abs(dp)<0.5?'same protein':`${dp>0?'+':'−'}${Math.abs(dp).toFixed(0)} g protein`;
    const kt=Math.abs(dk)<1?'same energy':`${dk>0?'+':'−'}${Math.abs(Math.round(dk))} kcal`;
    const tag=cur?'':`<em style="color:${dp<-3?'var(--chilli)':dp>3?'var(--leaf)':'var(--ink-3)'}">${pt} · ${kt}</em>`;
    return `<button class="opt${cur?' on':''}" data-pick="${key}" data-nf="${nf}" data-ng="${ng}">
      <span class="oi">${ico(o.i)}</span>
      <span class="on2">${o.n}${cur?' <span class="pill n">current</span>':''}${o.weak?' <span class="pill w">verify</span>':''}<em>${o.s}</em>${tag}</span>
      <span class="om"><b class="num">${amt(nf,ng)}</b>${badge(nf)}${Math.round(v.k)} kcal<br><span style="color:var(--chilli)">${v.p.toFixed(1)} g P</span></span></button>`;}).join('');
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function openMealPick(slot){
  const m=todayMeals().find(x=>x.slot===slot); if(!m) return;
  const names={b:'breakfast',mm:'mid-morning',l:'lunch',s:'afternoon',d:'dinner'};
  document.getElementById('sheetTitle').textContent='Choose a different '+names[slot];
  document.getElementById('sheetSub').textContent=isVeg(dayOf(state.day))
    ?'Vegetarian options only — no meat, fish or eggs today.':'Every option is built to the same targets.';
  const others=todayMeals().filter(x=>x.slot!==slot);
  const base=others.reduce((a,x)=>a+dayTotalFor('M',[x]).k,0);
  const tgt=PEOPLE.M.t.k;
  document.getElementById('sheetBody').innerHTML=m.pool.map(id=>{
    const meal=M[id], mealK=dayTotalFor('M',[{id,slot}]).k, dayK=base+mealK, d=dayK-tgt, cur=id===m.id;
    const col=Math.abs(d)<=45?'var(--leaf)':Math.abs(d)<=95?'var(--turmeric)':'var(--chilli)';
    return `<button class="opt${cur?' on':''}" data-mealpick="${slot}" data-mid="${id}">
      <span class="oi">${ico(meal.ic)}</span>
      <span class="on2">${meal.t}${cur?' <span class="pill n">today</span>':''}
        <em>${meal.x.filter(x=>x[2]==='pro').map(x=>F[x[0]].n).join(', ')||'—'}</em>
        <em style="color:${col};font-weight:600">day becomes ${Math.round(dayK)} kcal${Math.abs(d)<10?' — on target':(d>0?' (+':' (−')+Math.abs(Math.round(d))+')'}</em></span>
      <span class="om"><b class="num">${Math.round(mealK)}</b>kcal<br><span style="color:var(--chilli)">${dayTotalFor('M',[{id,slot}]).p.toFixed(0)} g P</span></span></button>`;}).join('');
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
const closeSwap=()=>{document.getElementById('sheet').classList.remove('on');document.getElementById('scrim').classList.remove('on');};

/* ================= events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-day],[data-mode],[data-who],[data-copy],[data-meal],[data-mealpick],[data-log],[data-swap],[data-pick],[data-close],[data-f],#wAdd');
  if(!t) return;
  if(t.dataset.tab){state.tab=t.dataset.tab;draw();}
  else if(t.dataset.day!==undefined){state.day=+t.dataset.day;draw();}
  else if(t.dataset.mode){state.mode=t.dataset.mode;draw();}
  else if(t.dataset.who){state.who=t.dataset.who;draw();}
  else if(t.dataset.copy){copyDay(t.dataset.copy,t);}
  else if(t.dataset.meal){openMealPick(t.dataset.meal);}
  else if(t.dataset.mealpick){state.picks[state.day+':'+t.dataset.mealpick]=t.dataset.mid;closeSwap();draw();}
  else if(t.dataset.log){state.logWho=t.dataset.log;draw();}
  else if(t.dataset.swap){openSwap(t.dataset.swap,t.dataset.type,t.dataset.fid,+t.dataset.g);}
  else if(t.dataset.pick){state.swaps[t.dataset.pick]={fid:t.dataset.nf,g:+t.dataset.ng};closeSwap();draw();}
  else if(t.dataset.close){closeSwap();}
  else if(t.dataset.f){document.querySelectorAll('#filt button').forEach(b=>b.classList.remove('on'));t.classList.add('on');drawFoods();}
  else if(t.id==='wAdd'){
    const v=parseFloat(document.getElementById('wIn').value);
    const who=state.logWho||'M';
    if(!isNaN(v)&&v>30&&v<200){state.w[who]=state.w[who].filter(p=>p.d!==state.day);
      state.w[who].push({d:state.day,kg:v}); state.w[who].sort((a,b)=>a.d-b.d);save();draw();}
  }
});
document.getElementById('scrim').addEventListener('click',closeSwap);
document.addEventListener('input',e=>{if(e.target.id==='q')drawFoods();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSwap();});

/* ================= storage (degrades to memory) ================= */
/* Three tiers: Claude's artifact storage, then the browser's own localStorage
   when this is hosted at a real URL, then memory. Whichever works, works. */
let canSave=true, backend='memory';
const KEY='plan:weights';
async function save(){
  const json=JSON.stringify(state.w);
  try{ if(typeof window.storage!=='undefined'){await window.storage.set(KEY,json); backend='claude'; canSave=true; return;} }catch(e){}
  try{ localStorage.setItem(KEY,json); backend='local'; canSave=true; return; }catch(e){}
  canSave=false;
}
async function load(){
  try{ if(typeof window.storage!=='undefined'){
    const r=await window.storage.get(KEY);
    if(r&&r.value){const p=JSON.parse(r.value); if(p&&p.M){state.w=p;backend='claude';canSave=true;return;}}
    backend='claude'; canSave=true; return;
  }}catch(e){}
  try{ const v=localStorage.getItem(KEY);
    if(v){const p=JSON.parse(v); if(p&&p.M) state.w=p;}
    localStorage.setItem('plan:probe','1'); localStorage.removeItem('plan:probe');
    backend='local'; canSave=true; return;
  }catch(e){}
  canSave=false;
}
/* the web app manifest, built at runtime so this stays a single file */
(function(){try{
  const m={name:'Consistency is key',short_name:'Consistency',start_url:'.',display:'standalone',
    background_color:'#FBFAF7',theme_color:'#0F5449',orientation:'portrait',
    description:'A 14-week nutrition plan for two people, cooked from one pan.',
    icons:[{src:document.querySelector('link[rel=apple-touch-icon]').href,sizes:'180x180',type:'image/png',purpose:'any maskable'}]};
  const l=document.getElementById('mf');
  if(l) l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
}catch(e){}})();
(async()=>{
  await load();
  const now=new Date(); now.setHours(0,0,0,0);
  const i=Math.round((now-START)/864e5);
  state.day=Math.min(Math.max(i,0),DAYS-1);
  draw();
})();

</script>
