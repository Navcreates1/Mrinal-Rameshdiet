<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mrinal and Ramesh — Consistency is key</title>
<meta name="description" content="A 14-week nutrition plan: three meals a day, 1,420 and 1,800 kcal, built around Indian home cooking, with the Ganesh Chaturthi and Dasara vegetarian windows already accounted for.">
<meta name="theme-color" content="#0F5449">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Plan">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" href="./icon.png">
<!-- A real manifest file, not a blob URL. Chrome will not treat a blob: manifest
     with a relative start_url and a data: icon as installable, so the Android
     install prompt never fired. -->
<link rel="manifest" href="./manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Mrinal and Ramesh — Consistency is key">
<meta property="og:description" content="Three meals a day, weighed. Fourteen weeks, both plates, one shopping list.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  /* Grounded in a kitchen, not a gym: curry-leaf green, chilli, turmeric, indigo.
     Marigold is reserved exclusively for the two festival fasting windows. */
  --paper:#FBFAF7;
  --card:#FFFFFF;
  --ink:#1A1D21;
  --ink-2:#5C6470;
  --ink-3:#6E737C;   /* was #949CA8 — 2.65:1 on paper, unreadable. 4.57:1 now */
  --rule:#E6E3DC;
  --leaf:#0F5449;      /* calories — the hero metric */
  --leaf-soft:#E4EEEA;
  --chilli:#B23A2E;    /* protein */
  --turmeric:#966C17;  /* carbohydrate — was #C08A1E at 2.92:1 */
  --indigo:#4A6FA5;    /* fat */
  --marigold:#E08A00;  /* festival / vegetarian days — a FILL, never text */
  --marigold-deep:#8A5A06;  /* the same idea as ink: white on this is 5.92:1 */
  --marigold-soft:#FDF1DE;
  --shadow:0 1px 2px rgba(26,29,33,.05), 0 8px 24px -12px rgba(26,29,33,.14);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:88px;
}
.wrap{max-width:460px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- hero ---------- */
.hero{background:var(--leaf);color:#fff;padding:22px 0 20px;position:relative;overflow:hidden}
@media (display-mode:standalone){.hero{padding-top:calc(22px + env(safe-area-inset-top))}.nav{padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}}
.hero.veg{background:#8A5A06}
.hero .wrap{position:relative;z-index:2}
.hero-name{font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;letter-spacing:.03em;opacity:.88;font-weight:500}
.hero-tag{font-family:'Fraunces',serif;font-size:30px;line-height:1.08;font-weight:700;margin:2px 0 14px}
.goal{display:flex;gap:0;border-top:1px solid rgba(255,255,255,.26);padding-top:12px}
.goal div{flex:1;min-width:0;padding-right:10px}
.goal div:last-child{flex:.72;padding-right:0}
.goal b{display:block;font-family:'Fraunces',serif;font-size:21px;font-weight:600;line-height:1.1}
.goal span{display:block;font-size:11px;opacity:.88;letter-spacing:.01em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- date strip ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:46px;padding:7px 0;border-radius:11px;text-align:center;background:var(--paper);border:1px solid var(--rule)}
.dchip s{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);text-decoration:none}
.dchip b{display:block;font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.25}
.dchip.veg{background:var(--marigold-soft);border-color:#F2D9A8}
.dchip.veg s{color:#B06E00}
.dchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dchip.on s{color:rgba(255,255,255,.6)}
.dchip.on.veg{background:var(--marigold);border-color:var(--marigold)}
.dchip.on.veg s{color:rgba(255,255,255,.8)}

/* ---------- banners ---------- */
.banner>span:first-child{flex:0 0 auto;width:24px;height:24px}
.banner>span:first-child svg{width:24px;height:24px;display:block}
.oilnote>span:first-child{flex:0 0 auto;width:20px;height:20px}
.oilnote>span:first-child svg{width:20px;height:20px;display:block}
.banner{display:flex;gap:11px;align-items:flex-start;background:var(--marigold-soft);border:1px solid #F2D9A8;border-radius:var(--r);padding:11px 13px;margin:14px 0;font-size:13px;line-height:1.45;color:#6B4400}
.banner b{color:#8A5A06}
.banner.warn{background:#FBEDEB;border-color:#F0D2CD;color:#7A2C22}
.banner.warn b{color:var(--chilli)}

/* ---------- ring + macros ---------- */
.dash{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);margin:14px 0}
.ringrow{display:flex;align-items:center;gap:18px}
.ringwrap{position:relative;width:118px;height:118px;flex:0 0 auto}
.ringwrap svg{transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-family:'Fraunces',serif;font-size:31px;font-weight:600;line-height:1}
.ringtxt s{font-size:11px;letter-spacing:.01em;color:var(--ink-3);text-decoration:none;margin-top:3px}
.bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.bar b{font-family:'Fraunces',serif;font-size:15px;font-weight:600}
.bar .lab{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-2);margin-bottom:4px}
.bar .lab i{font-style:normal;font-size:12px;font-weight:500;color:var(--ink-2)}
.track{height:7px;border-radius:4px;background:var(--rule);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.bar.p .track i{background:var(--chilli)}
 .bar.p b{color:var(--chilli)}
.bar.c .track i{background:var(--turmeric)} .bar.c b{color:var(--turmeric)}
.bar.f .track i{background:var(--indigo)} .bar.f b{color:var(--indigo)}
.bar.p .track{height:10px}
.fibre{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--rule);margin-top:14px;padding-top:11px}

/* ---------- mode toggle ---------- */
.modes{display:flex;background:var(--rule);border-radius:11px;padding:3px;margin:16px 0 4px}
.modes button{flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.modes button.on{background:var(--leaf);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.09);}
.modehint{font-size:12px;color:var(--ink-2);margin:8px 2px 14px;line-height:1.45}

/* ---------- meal cards ---------- */
.meal{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.mhead{display:flex;align-items:center;gap:12px;padding:13px 14px}
.mart{flex:0 0 auto;width:52px;height:52px;border-radius:11px;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.veg .mart{background:var(--marigold-soft)}
.mart svg{width:36px;height:36px;display:block}
.mtitle{flex:1;min-width:0}
.mtitle s{display:block;font-size:11.5px;letter-spacing:.01em;color:var(--ink-3);text-decoration:none}
.mtitle b{display:block;font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;line-height:1.25;margin-top:1px}
.mkcal{flex:0 0 auto;text-align:right;max-width:118px;}
.mkcal b{display:block;font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--leaf)}
.mkcal s{display:block;font-size:9.5px;color:var(--ink-3);text-decoration:none;font-weight:500;margin-top:1px}
.mbody{border-top:1px solid var(--rule);padding:4px 14px 13px}
.ing{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--rule)}
.ing:last-of-type{border-bottom:0}
.ing .g{flex:0 0 auto;min-width:74px;font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
.ing .n{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.ing .n em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-2);}
.ing .k{flex:0 0 auto;font-size:12px;color:var(--ink-2);text-align:right}
.swapbtn{flex:0 0 auto;padding:5px 9px;border:1px solid var(--rule);border-radius:8px;font-size:11px;font-weight:600;color:var(--leaf);background:var(--paper)}
.swapbtn:active{background:var(--leaf-soft)}
.oilnote{display:flex;gap:8px;align-items:flex-start;background:#FBEDEB;border-radius:10px;padding:9px 11px;margin-top:10px;font-size:11.5px;line-height:1.45;color:#7A2C22}
.method{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule)}
.method ol{margin:0;padding-left:17px;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.method li{margin-bottom:4px}
.method li::marker{color:var(--leaf);font-weight:700}

/* ---------- generic ---------- */
.sec{margin:24px 0 10px}
.sec h2{font-size:20px}
.sec p{margin:5px 0 0;font-size:13px;color:var(--ink-2);line-height:1.5}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h3{font-size:15.5px;margin-bottom:7px}
.panel p{font-size:13px;color:var(--ink-2);line-height:1.55;margin:0 0 8px}
.panel p:last-child{margin-bottom:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.kv span:first-child{flex:1.5;min-width:0}
.kv b{flex:0 0 auto;text-align:right;font-family:'Fraunces',serif;font-weight:600;}
.kv span:not(:first-child){flex:1;text-align:right}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-2)}
.src{font-size:10.5px;color:var(--ink-3);line-height:1.5;margin-top:9px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.01em}
.pill.v{background:var(--marigold-soft);color:#8A5A06}
.pill.n{background:var(--leaf-soft);color:var(--leaf)}
.pill.w{background:#FBEDEB;color:var(--chilli)}
.wbadge{display:block;margin-top:4px;padding:3px 7px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-align:center;background:#FBEDEB;color:var(--chilli);border:1px solid #EFC9C2}
.wbadge.dry{background:#FDF1DE;color:#8A5A06;border-color:#EDCE9C}

/* three portions per ingredient: what goes in the pan, and each plate */
.ing{display:block;padding:11px 0}
.iname{font-size:14px;line-height:1.35;font-weight:500}
.iname em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-2);font-weight:400;margin-top:1px}
.iname .wbadge{display:inline-block;margin:4px 0 0}
.pgrid{display:flex;gap:6px;margin-top:8px}
.pcell{flex:1;min-width:0;border:1px solid var(--rule);border-radius:9px;padding:6px 7px;background:var(--paper)}
.pcell s{display:block;font-size:9.5px;letter-spacing:.03em;color:var(--ink-3);text-decoration:none;margin-bottom:1px}
.pcell b{display:block;font-family:'Fraunces',serif;font-size:16px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.pcell i{display:block;font-style:normal;font-size:10px;color:var(--ink-2);margin-top:2px}
.pcell.pan{background:var(--leaf);border-color:var(--leaf);color:#fff}
.pcell.pan s{color:rgba(255,255,255,.72)}
.veg .pcell.pan{background:#8A5A06;border-color:#8A5A06}
.pcell.mm{border-color:#E8BDB5;background:#FDF5F3}
.pcell.rr{border-color:#BCCDE4;background:#F3F7FC}
.pcell.mm s,.pcell.rr s{font-weight:700;font-size:11px;letter-spacing:.01em}
.pcell.mm s{color:var(--chilli)} .pcell.rr s{color:var(--indigo)}
.pcell.mm b{color:#7A2C22} .pcell.rr b{color:#2F4C74}
.miniring h4{font-size:14.5px;margin:0 0 7px;font-family:'Fraunces',serif;font-weight:600;}
.miniring.m h4{color:var(--chilli)} .miniring.r h4{color:var(--indigo)}
.miniring.m{border-color:#E8BDB5} .miniring.r{border-color:#BCCDE4}
.pcell.dim{opacity:.34}
.ing .swapbtn{margin-top:8px}
.swaprow{display:flex;justify-content:flex-end}
/* who the page is showing */
.whobar{display:flex;gap:6px;background:var(--rule);border-radius:11px;padding:3px;margin:14px 0 0}

.modes{background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow)}
.changebtn{display:block;width:100%;padding:10px;border-top:1px solid var(--rule);font-size:12.5px;font-weight:600;color:var(--leaf);background:var(--paper)}
.changebtn:active{background:var(--leaf-soft)}
.whobar button{flex:1;padding:8px 0;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.whobar button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
/* must outrank '.whobar button' above, which sets a dark grey that was
   rendering at 1.95:1 against the dark header — effectively invisible */
.whobar.hero-who{background:rgba(0,0,0,.26);margin:12px 0 0;padding:4px}
.whobar.hero-who button{color:#fff;font-weight:600;font-size:13px;opacity:1}
.whobar.hero-who button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.duo{display:flex;gap:10px}
.duo>div{flex:1;min-width:0}
.miniring{text-align:center;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:13px 8px;box-shadow:var(--shadow)}
.miniring .ringwrap{width:92px;height:92px;margin:0 auto}
.miniring .ringtxt b{font-size:24px}
.miniring .ringtxt s{font-size:9.5px}
.mmacro{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;gap:3px}
.mmacro div{flex:1}
.mmacro b{display:block;font-family:'Fraunces',serif;font-size:13.5px;font-weight:600}
.mmacro s{display:block;text-decoration:none;color:var(--ink-3);font-size:9.5px}
.gitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.gitem:last-of-type{border-bottom:0}
.gitem input{width:19px;height:19px;flex:0 0 auto;accent-color:var(--leaf)}
.cbtn{flex:0 0 auto;padding:7px 11px;border:1px solid var(--rule);border-radius:9px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--paper)}
.cbtn.yes{background:var(--leaf);border-color:var(--leaf);color:#fff}
.cbtn.no{background:var(--indigo);border-color:var(--indigo);color:#fff}
.steps{display:flex;gap:4px;margin:0 0 16px}
.stp{flex:1;text-align:center;font-size:10px;color:var(--ink-3);line-height:1.3}
.stp b{display:block;width:24px;height:24px;line-height:23px;margin:0 auto 4px;border-radius:50%;border:1px solid var(--rule);font-family:'Fraunces',serif;font-size:12px;background:var(--card)}
.stp.now b{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stp.now span{color:var(--ink);font-weight:600}
.stp.done b{background:var(--leaf-soft);border-color:#BFD8CE;color:var(--leaf)}
.copybar button:disabled{cursor:default}
.vgrid{display:flex;flex-wrap:wrap;gap:6px}
.vchip{padding:8px 11px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);font-size:12.5px;font-weight:500;color:var(--ink-2);text-align:left}
.vchip i{display:block;font-style:normal;font-size:10px;color:var(--ink-3)}
.vchip.on{background:var(--leaf-soft);border-color:#BFD8CE;color:var(--leaf)}
.vchip.on i{color:var(--leaf);opacity:.75}
.gitem.done .gn{opacity:.45;text-decoration:line-through}
.gn{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.gn em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-2);margin-top:1px}
.gc{flex:0 0 auto;font-family:'Fraunces',serif;font-weight:600;font-size:14px;padding:4px 7px;border-radius:8px;border:1px solid transparent;text-align:right}
.gc.guess{border-style:dashed;border-color:#C6D3E5;color:var(--indigo);font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600}
.gc.approx{border-color:#EDCE9C;background:var(--marigold-soft);color:#8A5A06}
.gc.approx i{color:#B06E00;opacity:.85}
.gc i{display:block;font-style:normal;font-family:'IBM Plex Sans',sans-serif;font-size:9px;font-weight:600}
.priceform{display:flex;gap:8px;margin-top:12px}
.priceform input{flex:1;padding:12px 13px;border:1px solid var(--rule);border-radius:11px;font-size:16px;background:var(--paper)}
.priceform button{flex:0 0 auto;padding:12px 18px;border-radius:11px;background:var(--leaf);color:#fff;font-weight:600;font-size:13.5px}
.havebtn{flex:0 0 auto;padding:5px 9px;border:1px solid var(--rule);border-radius:8px;font-size:10.5px;font-weight:600;color:var(--ink-2);background:var(--paper)}
.copybar{display:flex;gap:8px;margin:14px 0 4px}
.copybar button{flex:1;padding:12px 10px;border-radius:11px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.copybar button.alt{background:var(--card);color:var(--ink);border:1px solid var(--rule)}
.copybar button.done{background:var(--leaf)}
.lunchbox{display:inline-block;padding:2px 7px;border-radius:6px;background:#EEF2F8;color:var(--indigo);font-size:10.5px;font-weight:600;margin-left:6px}
.cook{display:block;font-style:normal;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.cook b{color:var(--ink);font-weight:600}
.opt .on2 em{color:var(--ink-3);display:block;font-style:normal;font-size:10.5px;margin-top:1px;}
.frow .fn em{color:var(--ink-3);font-size:10.5px;display:block;font-style:normal;margin-top:1px;}

/* ---------- food table ---------- */
.search{width:100%;padding:11px 13px;border:1px solid var(--rule);border-radius:11px;background:var(--card);font-size:14px;margin-bottom:10px}
.search:focus{outline:2px solid var(--leaf);outline-offset:1px}
.filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto;padding:6px 12px;border:1px solid var(--rule);border-radius:20px;font-size:12px;font-weight:500;background:var(--card);color:var(--ink-2)}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.frow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:10px 12px;margin-bottom:7px}
.frow .fn{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.frow .fm{flex:0 0 auto;text-align:right;font-size:11px;color:var(--ink-2);line-height:1.5}
.frow .fm b{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--ink);display:block}
.frow .fm i{font-style:normal;color:var(--chilli);font-weight:600}

/* ---------- progress ---------- */
.chartbox{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
.wform{display:flex;gap:8px;margin-top:12px}
.wform input{flex:1;padding:11px 13px;border:1px solid var(--rule);border-radius:11px;font-size:14px;background:var(--paper)}
.wform button{flex:0 0 auto;padding:11px 18px;border-radius:11px;background:var(--leaf);color:#fff;font-weight:600;font-size:13.5px}
.milestone{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
.milestone:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule);flex:0 0 auto}
.dot.done{background:var(--leaf)}
.milestone .mt{flex:1;font-size:13px}
.milestone .mt em{display:block;font-style:normal;font-size:11px;color:var(--ink-3)}
.milestone b{font-family:'Fraunces',serif;font-weight:600;font-size:14px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--rule);z-index:60;padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:460px;margin:0 auto;display:flex}
.nav button{flex:1;min-width:0;padding:9px 1px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:9.5px;font-weight:600;letter-spacing:0}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--leaf)}
.hidden{display:none}

/* ---------- swap sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(26,29,33,.42);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;background:var(--paper);border-radius:20px 20px 0 0;z-index:90;transform:translateY(101%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheethead{padding:14px 16px 10px;border-bottom:1px solid var(--rule);flex:0 0 auto;position:relative}
#sheetClose{position:absolute;right:12px;top:20px;padding:7px 12px;border-radius:9px;background:var(--rule);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.sheethead h3{font-size:17px}
.sheethead p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
.grab{width:34px;height:4px;border-radius:3px;background:var(--rule);margin:0 auto 11px}
.sheetbody{overflow-y:auto;padding:12px 16px 28px;-webkit-overflow-scrolling:touch}
.opt{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:11px 12px;margin-bottom:8px;width:100%;text-align:left}
.opt.on{border-color:var(--leaf);background:var(--leaf-soft)}
.opt .oi{flex:0 0 auto;width:38px;height:38px;border-radius:9px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.opt .oi svg{width:26px;height:26px}
.opt .on2{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.opt .om{flex:0 0 auto;text-align:right;font-size:10.5px;color:var(--ink-2);line-height:1.45}
.opt .om b{display:block;font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:6px}

/* Components added or reshaped for the rebuild. Same tokens, same language as
   app.css — this file exists so the new Shop journey is legible in a diff
   rather than buried in a 300-line append-only sheet. */

.center{text-align:center}

/* --- day-type control. Three states per day: this is the fix for "it never
       asked me whether it's a vegetarian or non-vegetarian day". --- */
.dayrow{padding:11px 0;border-bottom:1px dashed var(--rule)}
.dayrow:last-of-type{border-bottom:0}
.dayrow.off{opacity:.55}
.dn{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px}
.dn .pill{margin-left:6px;vertical-align:1px}
.dseg{display:flex;gap:4px;background:var(--rule);border-radius:10px;padding:3px}
.dtype{flex:1;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.2}
.dtype.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}
/* --marigold behind white text is 2.69:1. It is a fill for pills and banner
   grounds, not a background for type — the deep tone is what the hero already
   uses for a fasting day. */
.dtype[data-daytype$="vegetarian"].on{background:var(--marigold-deep);color:#fff}
.dtype[data-daytype$="out"].on{background:var(--ink-2);color:#fff}
.pill.warn{background:#FBEDEB;color:var(--chilli)}

/* --- opt-in hints and the escape hatch that keeps opting in cheap --- */
.pickhint{font-size:12px;color:var(--ink-2);margin:0 0 10px;line-height:1.5}
.linkbtn{display:inline;padding:0;font-size:12px;font-weight:600;color:var(--leaf);text-decoration:underline;text-underline-offset:2px}

/* --- week picker --- */
.weeks{display:flex;gap:5px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.weeks .wk{flex:0 0 auto;min-width:34px;padding:7px 0;border-radius:9px;background:var(--card);border:1px solid var(--rule);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.weeks .wk.built{border-color:var(--leaf);color:var(--leaf)}
.weeks .wk.on{background:var(--leaf);border-color:var(--leaf);color:#fff}

/* --- week review --- */
.wrow{display:flex;align-items:baseline;gap:9px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.wrow:last-of-type{border-bottom:0}
.wrow.off{opacity:.5}
.wrow.veg{background:linear-gradient(90deg,var(--marigold-soft),transparent 60%);margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:8px}
.wrow .dn{flex:0 0 84px;margin:0;font-size:12.5px}
.wmeals{flex:1;min-width:0;font-size:11.5px;color:var(--ink-2);line-height:1.4}
.wk2,.wrow .wk{flex:0 0 auto;display:flex;gap:8px;font-family:'Fraunces',serif;font-size:13.5px;font-variant-numeric:tabular-nums}
.banner.ok{background:var(--leaf-soft);border-color:#BEDBD2;color:#0B4038}
.banner.ok b{color:var(--leaf)}
.banner.bad{background:#FBEDEB;border-color:#E4A79C;color:#7A2C22}
.banner.bad b{color:var(--chilli)}

/* --- Today: rings and meal cards --- */
.rings{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0 6px}
@media (min-width:400px){.rings:has(.miniring+.miniring){grid-template-columns:1fr 1fr}}
.kcal{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.kcal b{font-family:'Fraunces',serif;font-size:26px;line-height:1;color:var(--leaf)}
.kcal span{font-size:11.5px;color:var(--ink-2)}
.ktrack{flex:0 0 100%;height:5px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:5px}
.ktrack i{display:block;height:100%;background:var(--leaf);border-radius:3px}
.mrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);padding:3px 0}
.mrow>span:first-child{flex:0 0 52px}
.mtrack{flex:1;height:4px;border-radius:3px;background:var(--rule);overflow:hidden}
.mtrack i{display:block;height:100%;border-radius:3px}
.mrow b{flex:0 0 auto;font-family:'Fraunces',serif;font-size:12.5px;color:var(--ink)}
.mrow b em{font-style:normal;color:var(--ink-3);font-weight:400}
.src.warn{color:var(--chilli)}
.meal header{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--rule);background:#FCFBF9}
.mi{flex:0 0 auto;width:26px;height:26px}
.mi svg{width:26px;height:26px;display:block}
.mt{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.25}
.mt b{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.ings{padding:4px 15px}
/* NOT `.ing .pan b{color:var(--leaf)}` — that was written for an earlier markup
   where the pan figure sat on white. On the green .pcell.pan it rendered the
   number green on green: invisible, and the same class of defect as the person
   switcher at 1.95:1 in section 14.3. The cell's own colour:#fff is correct.
   The browser harness now sweeps every text node for contrast so this cannot
   come back quietly. */
.ing .g i{display:block;font-style:normal;font-size:10px;font-weight:400;color:var(--ink-3);letter-spacing:.02em}
.pickbtn{flex:0 0 auto;padding:6px 11px;border-radius:8px;background:var(--rule);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.method{margin:0;padding:12px 15px 15px 32px;font-size:12.5px;color:var(--ink-2);line-height:1.55;background:#FCFBF9;border-top:1px solid var(--rule)}
.method li{margin-bottom:5px}
.method li:last-child{margin-bottom:0}
.meal .src{padding:0 15px 13px}

/* --- date strip --- */
.chip{flex:0 0 auto;padding:7px 11px;border-radius:9px;background:var(--paper);border:1px solid var(--rule);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip.veg{background:var(--marigold-soft);border-color:#EDCE9C;color:#8A5A06}
.chip.out{opacity:.5;text-decoration:line-through}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chip.on.veg{background:var(--marigold-deep);border-color:var(--marigold-deep);color:#fff}

/* --- Foods --- */
#q{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);font-size:14px;font-family:inherit;color:var(--ink)}
.fchips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;padding:7px 11px;border-radius:9px;background:var(--paper);border:1px solid var(--rule);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.fchip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.fi{flex:0 0 auto;width:24px;height:24px}
.fi svg{width:24px;height:24px;display:block}
.srcline{color:var(--ink-3)!important;font-size:10.5px!important}

/* --- Plan tables --- */
.ktable{width:100%;border-collapse:collapse;font-size:12.5px}
.ktable th{text-align:left;font-weight:600;color:var(--ink);padding:8px 6px 8px 0;border-bottom:1px dashed var(--rule);vertical-align:top}
.ktable th em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);font-weight:400;line-height:1.35}
.ktable td{padding:8px 0 8px 6px;border-bottom:1px dashed var(--rule);color:var(--ink-2);text-align:right;vertical-align:top}
.ktable td.num{font-family:'Fraunces',serif;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ktable thead td{color:var(--ink);text-align:right}
.ktable tbody tr:last-child th,.ktable tbody tr:last-child td{border-bottom:0}
.rules{margin:0;padding-left:20px;font-size:13px;color:var(--ink-2);line-height:1.6}
.rules li{margin-bottom:11px}
.rules li:last-child{margin-bottom:0}
.rules b{color:var(--ink)}

/* --- Weight --- */
.whobar2{display:flex;gap:6px;background:var(--rule);border-radius:11px;padding:3px;margin:16px 0 12px}
.whobar2 button{flex:1;padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.whobar2 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.chart{width:100%;height:190px;display:block}
.chart .pace{stroke:var(--ink-3);stroke-width:.4;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
.chart .line{fill:none;stroke:var(--leaf);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.chart .dot{fill:var(--leaf)}
.wadd{display:flex;gap:8px}
.wadd input{flex:1;min-width:0;padding:11px 13px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);font-size:14px;font-family:inherit;color:var(--ink)}
.wadd input[aria-invalid="true"]{border-color:var(--chilli)}
.wadd button{flex:0 0 auto;padding:11px 15px;border-radius:10px;background:var(--leaf);color:#fff;font-size:13px;font-weight:600}
.wlist{margin-top:12px;border-top:1px dashed var(--rule)}
.wrow2{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:12.5px;color:var(--ink-2)}
.wrow2:last-child{border-bottom:0}
.wrow2 b{font-family:'Fraunces',serif;color:var(--ink)}

/* --- swap and picker sheets --- */
.swapopt{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--card);margin-bottom:7px;text-align:left}
.swapopt.on{border-color:var(--leaf);background:var(--leaf-soft)}
.so-n{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3}
.so-n i{font-style:normal;font-size:10.5px;font-weight:600;color:var(--leaf);letter-spacing:.03em}
.so-g{flex:0 0 auto;font-family:'Fraunces',serif;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.so-d{flex:0 0 72px;text-align:right;font-size:11px;line-height:1.35}
.so-d b{display:block;font-family:'Fraunces',serif;font-size:12.5px}
.so-d i{font-style:normal;color:var(--ink-3)}

/* --- layout corrections found by the browser harness, not by reading --- */

/* `.strip{display:flex}` out-specifies the hidden attribute's UA default, so
   `strip.hidden = true` set the attribute and changed nothing: the date chips
   kept their 65 px of height and their horizontal scroll on every other tab. */
[hidden]{display:none!important}

/* The Foods row crushed its own name column to zero width at 320 px, because
   the five-figure macro block had no width limit and .fn had nothing to give.
   The numbers are a grid now, so the column is a known width and wraps. */
.frow{align-items:flex-start;flex-wrap:wrap}
.frow .fn{flex:1 1 60%;min-width:0}
.frow .fm{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px 7px;text-align:center;margin-left:auto}
.frow .fm b{display:block;font-size:13.5px;line-height:1.15}
.frow .fm i{display:block;font-style:normal;font-size:9px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.frow .fn .wbadge{display:inline-block;margin:3px 0 0 6px;vertical-align:2px}
.frow .fn em{overflow-wrap:anywhere}

/* Meal card headers had 14 px nowhere to go at 320 px. Let the right-hand
   block drop under the title rather than squeezing the dish name. */
.meal header{flex-wrap:wrap}
.mt{flex:1 1 55%}
.meal header .mkcal{margin-left:auto}
.mkcal i{display:block;font-style:normal;font-size:9.5px;color:var(--ink-3);font-weight:500;margin-top:1px}

/* Long ingredient and source text must wrap, not push the row wider. */
.ing .n em,.wmeals,.so-n,.gn em{overflow-wrap:anywhere}

/* The hero's two facts ran together as "98 days left1 of 15 weeks" — the same
   collision section 14.3 logged as "goaldays left". There was no .goal-row rule
   at all; the old markup happened to space itself. */
.goal-row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;opacity:.92;margin-bottom:14px}
.goal-row b{font-family:'Fraunces',serif;font-size:16px;font-weight:600}

/* The sticky date strip is 65px tall, so a card scrolled to must clear it. */
.meal,.panel{scroll-margin-top:78px}

/* A chosen dish sits on --leaf-soft, where the tertiary ink drops to 4.02:1.
   The tint changes the background, so the text on it has to change too. */
.opt.on .on2 em{color:var(--ink-2)}
</style>

h:1,src:"USDA FDC"},oil:{n:"Cooking oil",s:"per ml \u2014 sunflower, rapeseed, groundnut, mustard are identical",k:813,p:0,c:0,f:92,fb:0,v:1,i:"oil",ml:1,packs:[1e3,500],src:"USDA \u2014 884 kcal/100 g, 0.92 g/ml"},ghee:{n:"Ghee",s:"per ml",k:828,p:0,c:0,f:92,fb:0,v:1,i:"oil",ml:1,shop:"indian",src:"Heroveda / NutriScan"}},O=Object.keys(h),Lo=O.filter(t=>h[t].w),Ae=O.filter(t=>h[t].weak),Wo=O.filter(t=>h[t].unit),Bo=O.filter(t=>h[t].cost!==void 0);var k={bnv1:{t:"Egg bhurji with roti",v:0,ic:"egg",slot:"b",x:[["egg",100,"pro"],["white",70,"fix"],["spinach",80,"veg"],["onion",40,"fix"],["tomato",60,"fix"],["oil",5,"fat"],["atta",30,"carb"]],m:["Whisk the eggs and whites together with salt, turmeric and chilli powder.","Heat the measured oil, soften the onion and tomato for 3 minutes.","Add the spinach, wilt for 1 minute, then pour in the egg.","Stir on a low heat until just set. Do not add more oil at this stage.","Roll one roti from 35 g of atta and cook it dry on a hot tawa."]},bnv2:{t:"Greek yoghurt, oats and berries",v:0,ic:"yoghurt",slot:"b",x:[["greek",140,"pro"],["whey",12,"fix"],["oats",38,"carb"],["almond",10,"fix"],["berries",80,"fruit"]],m:["Weigh the yoghurt straight into the bowl.","Stir the whey powder and dry oats through, then leave 5 minutes to soften, or soak overnight.","Top with the berries and about eight almonds, counted out. No honey, no sugar."]},bv1:{t:"Greek yoghurt, oats and berries",v:1,ic:"yoghurt",slot:"b",x:[["greek",140,"pro"],["whey",12,"fix"],["oats",38,"carb"],["almond",10,"fix"],["berries",80,"fruit"]],m:["Weigh the yoghurt straight into the bowl.","Stir the whey powder and dry oats through, then leave 5 minutes, or soak overnight.","Top with the berries and about eight almonds, counted out. No honey, no sugar."]},bv2:{t:"Paneer bhurji with roti",v:1,ic:"paneer",slot:"b",x:[["paneerlf",100,"pro"],["onion",40,"fix"],["tomato",60,"fix"],["capsicum",60,"veg"],["oil",5,"fat"],["atta",25,"carb"]],m:["Crumble the weighed paneer with your fingers.","Heat the measured oil, soften onion, tomato and capsicum for 4 minutes.","Add the paneer with turmeric, chilli and salt, cook 3 minutes.","Roll one roti from 35 g of atta and cook it dry on a hot tawa."]},bv3:{t:"Masala oats with soya",v:1,ic:"oats",slot:"b",x:[["oats",20,"carb"],["soya",25,"pro"],["greek",70,"fix"],["whey",8,"fix"],["peas",60,"veg"],["onion",40,"fix"],["oil",7.5,"fat"]],m:["Soak the weighed soya chunks in boiling water 10 minutes, squeeze dry, chop.","Heat the measured oil, fry the onion, add peas and soya.","Add the oats and 200 ml water, season, simmer 5 minutes until thick.","Serve the weighed Greek yoghurt on the side. It is what carries the protein here."]},bhuel:{t:"Huel shake",v:1,ic:"whey",slot:"b",x:[["huelb",75,"pro"],["berries",80,"fruit"]],m:["Weigh the powder \u2014 do not eyeball the scoop. A scoop is roughly 45 g, so this is about one and a half.","Shake with 400 ml cold water for 10 seconds and leave it 2 minutes to thicken.","Berries on the side. This is the fastest breakfast in the plan and the one to reach for on a morning that has already gone wrong.","Huel is vegan, so it works on the Ganesh and Dasara days too."]},mm1:{t:"Whey shake",v:1,ic:"whey",slot:"mm",x:[["whey",25,"pro"]],m:["Weigh 25 g of isolate \u2014 slightly under one scoop on most tubs.","Shake with 250 ml cold water. Not milk: milk adds calories she has not budgeted."]},mm2:{t:"Greek yoghurt and berries",v:1,ic:"yoghurt",slot:"mm",x:[["greek",100,"pro"],["whey",8,"fix"],["berries",60,"fruit"]],m:["Weigh the yoghurt, stir the whey powder in until smooth, then the berries.","The whey is there so this is a protein snack rather than a tub of yoghurt \u2014 it does the same job for a third of the cost and a fifth of the bulk."]},lnv1:{t:"Lemon and pepper chicken, rice and broccoli",v:0,ic:"chicken",slot:"l",x:[["chicken",145,"pro"],["oil",7.5,"fat"],["rice",45,"carb"],["broccoli",200,"veg"]],m:["Weigh the chicken RAW. Rub with lemon juice, cracked black pepper and salt. Nothing else.","Rinse the weighed rice and cook in 2 parts water. No butter, no oil in the rice.","Steam the broccoli 5 minutes so it still has bite.","Heat the measured oil and grill the chicken 5-6 minutes each side."]},lnv2:{t:"Home chicken curry with rice",v:0,ic:"chicken",slot:"l",x:[["chicken",140,"pro"],["oil",7.5,"fat"],["rice",40,"carb"],["spinach",150,"veg"],["onion",50,"fix"],["tomato",60,"fix"]],m:["Weigh the chicken RAW and cut into pieces.","Heat the measured 7.5 ml of oil - no free pouring - and brown the onion.","Add tomato, ginger, garlic and the usual masala, then the chicken.","Add 150 ml water, cover, simmer 15 minutes. Stir the spinach through at the end.","Cook the weighed rice separately."]},lnv3:{t:"Grilled salmon, quinoa and beans",v:0,ic:"fish",slot:"l",x:[["salmon",95,"pro"],["quinoa",58,"carb"],["beans",200,"veg"],["oil",7.5,"fat"]],m:["Weigh the salmon RAW. Season with salt, pepper and lemon.","Rinse and cook the weighed quinoa in 2 parts water for 15 minutes.","Steam the beans, then toss with the measured oil and garlic.","Grill the salmon 4 minutes a side. Salmon carries its own fat - that is why the oil stays at 5 ml."]},lnv4:{t:"Prawn masala with rice",v:0,ic:"prawn",slot:"l",x:[["prawns",165,"pro"],["oil",7.5,"fat"],["rice",55,"carb"],["okra",180,"veg"],["onion",50,"fix"],["tomato",60,"fix"]],m:["Weigh the prawns RAW and peeled.","Heat the measured oil, fry onion and tomato with masala for 5 minutes.","Add the okra, cook 6 minutes, then the prawns for the last 4 minutes only.","Cook the weighed rice separately. Prawns are lean but low in protein per gram - hence the large portion."]},lv1:{t:"Grilled paneer, rice and broccoli",v:1,ic:"paneer",slot:"l",x:[["paneerlf",100,"pro"],["oil",7.5,"fat"],["rice",35,"carb"],["broccoli",200,"veg"]],m:["Weigh the paneer and cut into thick fingers.","Rub with salt, chilli, turmeric and a spoon of curd from the fridge.","Rinse and cook the weighed rice plain.","Steam the broccoli. Pan-grill the paneer in the measured oil, 3 minutes a side."]},lv2:{t:"Palak paneer with rice",v:1,ic:"paneer",slot:"l",x:[["paneerlf",95,"pro"],["spinach",250,"veg"],["oil",7.5,"fat"],["rice",32,"carb"],["onion",40,"fix"],["tomato",50,"fix"]],m:["Blanch the weighed spinach 2 minutes then blend. 250 g raw collapses to very little.","Heat the measured oil, fry onion, tomato, ginger and garlic.","Add the spinach puree and simmer 5 minutes. No cream, no butter.","Fold in the weighed paneer at the end. Serve with the plain cooked rice."]},lv3:{t:"Soya chunk curry with rice",v:1,ic:"soya",slot:"l",x:[["soya",45,"pro"],["greek",70,"fix"],["whey",8,"fix"],["oil",10,"fat"],["rice",20,"carb"],["capsicum",150,"veg"],["onion",50,"fix"],["tomato",60,"fix"]],m:["Weigh 45 g DRY soya. Soak in boiling water 10 minutes, then squeeze out every drop.","Heat the measured oil, brown the onion, add tomato and masala.","Add capsicum and the squeezed soya, splash in 150 ml water, simmer 10 minutes.","Cook the weighed rice separately. The yoghurt with whey stirred through is not optional - it is part of the protein."]},lv4:{t:"Rajma with rice and curd",v:1,ic:"dal",slot:"l",x:[["rajma",50,"pro"],["greek",90,"fix"],["whey",10,"fix"],["oil",7.5,"fat"],["rice",18,"carb"],["spinach",150,"veg"],["onion",50,"fix"],["tomato",60,"fix"]],m:["Weigh 50 g DRY rajma, soak overnight, pressure-cook 5 whistles.","Heat the measured oil, make the onion-tomato base with ginger and garlic.","Add the cooked rajma with its water and simmer 10 minutes.","Wilt the spinach in at the end. Small rice portion here because rajma is already high in carbohydrate.","The yoghurt and the scoop of whey stirred into it carry roughly half the protein of this meal. Do not skip either."]},lv5:{t:"Chana masala with roti and curd",v:1,ic:"dal",slot:"l",x:[["chana",50,"pro"],["greek",100,"fix"],["whey",12,"fix"],["oil",7.5,"fat"],["atta",25,"carb"],["tomato",100,"veg"],["onion",50,"fix"]],m:["Weigh 50 g DRY chickpeas, soak overnight,
